<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Hunter | The Arcade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="arcade.css">
    <link rel="stylesheet" href="vinylhunter.css">
</head>
<body>

    <div class="arcade-room">
        <div class="game-wrapper">
            
            <!-- HUD Header -->
            <div class="hud">
                <div>SCORE: <span id="score">0</span></div>
                <button id="pauseBtn" class="hud-btn">PAUSE</button>
                <div>LIVES: <span id="lives">❤️❤️❤️</span></div>
            </div>
            
            <!-- Canvas with Relative Container for Overlays -->
            <div class="canvas-container">
                <canvas id="gameCanvas" width="560" height="560"></canvas>

                <!-- Instructions / Pause Modal Overlay -->
                <div id="instructionModal" class="overlay">
                    <div class="modal-card">
                        <h2 id="modalTitle">HOW TO PLAY</h2>
                        <ul class="instructions">
                            <li>🕹️ <b>Arrow Keys</b> to navigate the maze.</li>
                            <li>🎵 Collect <b>Pink Vinyls</b> (+10 pts) and <b>Gold Records</b> (+50 pts).</li>
                            <li>⚡ Speed increases as your score grows!</li>
                            <li>👾 Avoid the music critics or lose a life.</li>
                        </ul>
                        
                        <div class="modal-buttons">
                            <button id="startGameBtn" class="neon-btn">START GAME</button>
                            <button id="exitGameBtn" class="neon-btn exit-btn hidden">EXIT GAME</button>
                        </div>
                    </div>
                </div>

                <!-- 3-Second Countdown Overlay -->
                <div id="countdownOverlay" class="overlay hidden">
                    <div id="countdownText">3</div>
                </div>
            </div>

        </div>
    </div>

    <script src="vinylhunter.js"></script>
</body>
</html>
