<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Wise Ones Records</title>
</head>

<body>
    <!-- 2. Player Interface -->
    <div class="player-container">
        <div id="track-title">Ready to Mix</div>
        
        <audio id="audio-player">
            Your browser does not support the audio element.
        </audio>
        
        <button id="start-btn" style="padding: 10px 20px; cursor: pointer;">WELCOME TO THE PARTY</button>
        
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="waveform-bg">
                <div id="progress-bar"></div>
            </div>
            <span id="duration">0:00</span>
        </div>
    </div>
    <!-- 1. Load External Libraries First -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- 3. Load Your Custom Scripts Last -->
    <script src="three.js"></script> <!-- Your star background script -->
    <script src="songController.js"></script> <!-- Your music logic script -->
</body>
</html>
