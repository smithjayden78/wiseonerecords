<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart & Soul - Access Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">
    <div class="login-container">
        <!-- Logo image using your ultra-smooth blue & yellow animation -->
        <div class="login-logo-wrapper">
            <img src="logo2.png" alt="Heart & Soul Records" class="sidebar-logo">
        </div>
        
        <div class="terminal-box">
    <h2 class="terminal-title">SYSTEM ACCESS</h2>
    <p class="terminal-subtitle">AUTHENTICATE TO INITIALIZE COIN</p>
    
    <div id="error-msg" class="terminal-error"></div>
    
    <div id="step-1-container">
        
        <form id="login-form" onsubmit="handleEmailAuth(event)">
            <div class="input-group">
                <input type="email" id="email" placeholder=" " autocomplete="off">
                <label for="email">EMAIL ADDRESS</label>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder=" " autocomplete="off">
                <span class="password-toggle" id="togglePassword">
                    <i data-lucide="eye-off"></i>
                </span>
                <label for="password">PASSWORD</label>
            </div>
            
            <button type="submit" class="login-btn">LOGIN</button>
        </form>

        <div class="terminal-divider"><span>OR</span></div>

        <button onclick="loginWithGoogle()" class="google-login-btn">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.22-.67-.35-1.37-.35-2.09z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            CONNECT GMAIL ID
        </button>
        
    </div>

    <div id="step-2-container" style="display: none;">
        
        <p class="terminal-subtitle" style="color: var(--arcade-yellow); margin-bottom: 25px;">
            AUTHENTICATION SUCCESSFUL. SELECT YOUR PILOT CALLSIGN:
        </p>
        
        <form id="username-form" onsubmit="handleUsernameSave(event)">
            <div class="input-group">
                <input type="text" id="username" placeholder=" " maxlength="12" autocomplete="off" required>
                <label for="username">ARCADE TAG</label>
            </div>
            
            <button type="submit" class="login-btn" style="border-color: var(--neon-pink); color: var(--neon-pink);">
                INITIALIZE CORE GAME
            </button>
        </form>     
    </div>
</div>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module" src="login.js"></script>
</body>
</html>
