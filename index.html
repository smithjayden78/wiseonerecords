<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart & Soul - Access Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">
    <!-- Starfield/Particles can render back here -->
    <div class="login-container">
        <!-- Pure logo image pulsing using your new blue & yellow animation -->
        <div class="login-logo-wrapper">
            <img src="logo.png" alt="Heart & Soul Records" class="sidebar-logo">
        </div>
        
        <div class="terminal-box">
            <h2 class="terminal-title">SYSTEM ACCESS</h2>
            <p class="terminal-subtitle">INSERT CREDENTIALS TO INITIALIZE COIN</p>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">OPERATOR ID</label>
                    <input type="text" id="username" required placeholder="e.g., PLAYER_01" autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label for="password">ACCESS KEY</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <div id="error-msg" class="terminal-error"></div>
                
                <button type="submit" class="login-btn">INITIALIZE SYSTEM</button>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // Set up your gateway credentials here
            if (user === "ADMIN" && pass === "ARCADE2026") {
                errorMsg.style.display = "none";
                // Redirect straight to your music system hub
                window.location.href = "index.html"; 
            } else {
                errorMsg.innerText = "ACCESS DENIED: INVALID KEY IDENTIFIER";
                errorMsg.style.display = "block";
                
                // Shake effect on error
                const box = document.querySelector('.terminal-box');
                box.style.animation = 'none';
                setTimeout(() => box.style.animation = 'terminalShake 0.3s ease', 10);
            }
        }
        window.location.href = "dashboard.html";
    </script>
</body>
</html>
