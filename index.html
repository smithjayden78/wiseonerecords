<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wise Ones Records | Experience</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<nav class="top-nav">
    <div class="nav-links">
        <a href="#arcade">ARCADE</a>
        <a href="#crew">CREW</a>
        <a href="#gallery">GALLERY</a>
        <a href="#contact">CONTACT US</a>
    </div>
</nav>
<div class="glass-container" id="app-interface">
    <aside class="sidebar">
        <div class="brand">
            <h1>WISE ONES</h1>
            <p>RECORDS</p>
        </div>
        <div class="search-box">
            <input type="text" id="search" placeholder="Search Bangers...">
        </div>
        <ul id="playlist"></ul>
    </aside>

    <main class="player-section">
        <div class="player-core">
            <div class="album-wrapper">
                <div class="album-glow"></div>
                <img id="album-cover" src="Covers/wise ones.png" alt="Album Art">
            </div>

            <div class="track-info">
                <h2 id="track-title">WELCOME TO THE PARTY</h2>
                <p class="artist-name">THE WISE ONES</p>
            </div>

            <div class="playback-container">
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
                <div class="progress-area" id="progress-bar">
                    <div class="progress-bar"></div>
                </div>
            </div>

            <div class="main-controls">
                <button id="shuffle-btn" class="sub-btn">🔀</button>
                <button id="prev-btn" class="nav-btn">⏮</button>
                <button id="play-pause-btn" class="play-btn">▶</button>
                <button id="next-btn" class="nav-btn">⏭</button>
                <button id="repeat-btn" class="sub-btn">🔁</button>
            </div>
        </div>
    </main>
</div>

<div id="overlay">
    <button id="start-btn">ENTER THE ARCHIVE</button>
</div>

<audio id="audio-player"></audio>
<script src="songController.js"></script>
<script src="three.js"></script>
</body>
</html>
