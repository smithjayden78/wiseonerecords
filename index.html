<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wise Ones Records</title>

<link rel="stylesheet" href="style.css">

<!-- WaveSurfer -->
<script src="https://unpkg.com/wavesurfer.js"></script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <h2>WISE ONES</h2>
        <input type="text" id="search" placeholder="Search tracks...">
        <ul id="playlist"></ul>
    </aside>

    <main class="main">

        <div class="player-card">

            <img id="album-cover" class="album" src="Covers/wise ones.png">

            <h2 id="track-title">WELCOME TO THE PARTY</h2>

            <div class="equalizer" id="equalizer">
                <span></span><span></span><span></span><span></span>
            </div>

            <div id="waveform"></div>

            <div class="controls" id="controls" style="display:none;">
                <button id="shuffle-btn">🔀</button>
                <button id="prev-btn">⏮</button>
                <button id="play-pause-btn">▶</button>
                <button id="next-btn">⏭</button>
                <button id="repeat-btn">🔁</button>
            </div>

            

            <button id="start-btn" class="start-btn">
                ENTER EXPERIENCE
            </button>

        </div>

    </main>

</div>

<audio id="audio-player"></audio>

<script src="songController.js"></script>
<script src="three.js"></script>
</body>
</html>
